name: Build APK

on:
  workflow_dispatch:   # ручной запуск
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP if exists
        run: |
          if [ -f groq_chat_app.zip ]; then
            echo "Extracting zip..."
            unzip -o groq_chat_app.zip
            if [ -d groq_chat_app ]; then
              cp -r groq_chat_app/* .
              rm -rf groq_chat_app
            fi
            rm -f groq_chat_app.zip
          else
            echo "No zip found, using existing files"
          fi
          ls -la

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
